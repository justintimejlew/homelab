apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "0 */3 * * *" # Runs every 3 hours
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1 # Prevents history from being cluttered
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: m920q # moved node to prevent t480 from running hot
          containers:
            - name: renovate
              resources:
                limits: { cpu: "1", memory: 1Gi }
              image: renovate/renovate:latest
              args:
                - justintimejlew/homelab

              envFrom:
                - secretRef:
                    name: renovate-container-env
                - configMapRef:
                    name: renovate-configmap

          restartPolicy: Never
