apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.37.2
          ports:
            - containerPort: 3005
              protocol: TCP

          envFrom:
            - configMapRef:
                name: audiobookshelf-configmap

      restartPolicy: Always
      #     volumeMounts:
      #       - name: linkding-data
      #         mountPath: /etc/linkding/data
      # volumes:
      #   - name: linkding-data
      #     persistentVolumeClaim:
      #       claimName: linkding-data-pvc
