apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  replicas: 2 # Recommended to use 2 for elastic scaling
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            # Points cloudflared to the config file created by the ConfigMap below.
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          livenessProbe:
            httpGet:
              # Returns 200 only while cloudflared has an active connection to the edge.
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            # The tunnel credentials file, stored in a SOPS-encrypted secret.
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: creds
          secret:
            secretName: tunnel-credentials
        - name: config
          configMap:
            name: cloudflared
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
data:
  config.yaml: |
    # Name of the tunnel created with `cloudflared tunnel create`
    tunnel: site

    credentials-file: /etc/cloudflared/creds/credentials.json

    # Serves the metrics server under /metrics and the readiness server under /ready
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    ingress:
    - hostname: justintimejlew.com
      service: http://justintimejlew:80
    # nginx redirects www to the apex domain
    - hostname: www.justintimejlew.com
      service: http://justintimejlew:80
    # subdomains for my apps
    - hostname: audiobookshelf.justintimejlew.com
      service: http://audiobookshelf.audiobookshelf:3005
    # cloudflared requires a catch-all as the last rule
    - service: http_status:404
